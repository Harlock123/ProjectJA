# On-prem compose. App + Postgres + MinIO + Caddy. No PgBouncer (single tenant).
# A customer should be able to `docker compose -f docker-compose.onprem.yml up` and have a working install.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: projectja
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes:
      - miniodata:/data

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Database=projectja;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Tenancy__Mode: OnPrem
      Storage__Endpoint: http://minio:9000
      Storage__Bucket: projectja
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Email__Driver: smtp
      Email__Smtp__Host: ${SMTP_HOST:-localhost}
      Email__Smtp__Port: ${SMTP_PORT:-25}
      Email__From: ${EMAIL_FROM:-projectja@localhost}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
